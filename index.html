<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<link rel="manifest" href="manifest.json">
<title>R.R Modern Interior</title>
<style>
:root{--gold:#d6b35b;--black:#101010;--panel:#1c1c1c}
*{box-sizing:border-box}body{margin:0;background:var(--black);color:#f7f2e7;font-family:Arial,sans-serif}
header{padding:24px 18px 18px;text-align:center;background:linear-gradient(145deg,#090909,#242018);border-bottom:1px solid #806b37}
.logo{width:min(76vw,310px);height:auto;display:block;margin:0 auto 14px;border-radius:12px}
h1{color:var(--gold);font-size:25px;margin:8px 0} .tag{color:#e8d9ad;margin:0;font-size:14px}
main{max-width:760px;margin:auto;padding:20px 16px 36px}
h2{color:var(--gold);font-size:20px;margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{background:var(--panel);border:1px solid #574a2b;border-radius:14px;padding:18px 12px;text-align:center}
.symbol{font-size:30px;margin-bottom:8px}.item b{color:#f3dfaa}
.contact{margin-top:22px;padding:20px;background:#1b1b1b;border:1px solid #806b37;border-radius:16px;text-align:center}
.number{font-size:23px;color:var(--gold);font-weight:bold;letter-spacing:1px;margin:10px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a.btn{display:inline-block;text-decoration:none;padding:13px 18px;border-radius:10px;font-weight:bold}
.call{background:var(--gold);color:#17130a}.wa{border:1px solid #b99a4d;color:#f4dfaa}
footer{text-align:center;color:#b9ad91;font-size:12px;margin-top:22px}
</style>
</head>
<body>
<header>
  <img class="logo" src="logo.png" alt="R.R Modern Interior logo">
  <h1>R.R MODERN INTERIOR</h1>
  <p class="tag">WE DESIGN YOUR DREAM SPACE</p>
  <p class="tag">Bhadokhar, Ayodhya</p>
</header>
<main>
  <h2>हमारी सेवाएँ</h2>
  <section class="grid">
    <div class="item"><div class="symbol">🏠</div><b>Gypsum Work</b></div>
    <div class="item"><div class="symbol">🪵</div><b>PVC Panel</b></div>
    <div class="item"><div class="symbol">💡</div><b>False Ceiling</b></div>
    <div class="item"><div class="symbol">🛋️</div><b>Room Interior</b></div>
  </section>
  <section class="contact">
    <h2>संपर्क करें</h2>
    <div class="number">8738947315</div>
    <div class="actions">
      <a class="btn call" href="tel:8738947315">कॉल करें</a>
      <a class="btn wa" href="https://wa.me/918738947315" target="_blank" rel="noopener">WhatsApp करें</a>
    </div>
  </section>
  <footer>© R.R Modern Interior · Bhadokhar, Ayodhya</footer>
</main>
</body>
</html>
